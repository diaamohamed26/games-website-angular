<nav class="navbar navbar-expand-lg gaming-navbar fixed-top">

  <div class="container">

    <!-- LOGO -->
    <a
      class="navbar-brand gaming-logo"
      routerLink="/"
    >

      <span class="logo-icon">
        <i class="bi bi-controller"></i>
      </span>

      <span class="logo-text">
        GAME<span>HUB</span>
      </span>

    </a>


    <!-- MOBILE BUTTON -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-label="Toggle navigation"
    >
      <i class="bi bi-list"></i>
    </button>


    <!-- NAVIGATION -->
    <div
      class="collapse navbar-collapse"
      id="mainNavbar"
    >

      <ul class="navbar-nav mx-auto">


        <!-- HOME -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Home
          </a>

        </li>


        <!-- GAMES -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/games"
            routerLinkActive="active"
          >
            Games
          </a>

        </li>


        <!-- CATEGORIES -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/"
            fragment="categories"
            [class.active]="isSectionActive('categories')"
          >
            Categories
          </a>

        </li>


        <!-- TRENDING -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/"
            fragment="trending"
            [class.active]="isSectionActive('trending')"
          >
            Trending
          </a>

        </li>


        <!-- NEW RELEASES -->
        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/"
            fragment="new-releases"
            [class.active]="isSectionActive('new-releases')"
          >
            New Releases
          </a>

        </li>

      </ul>


      <!-- ACTIONS -->
      <div class="navbar-actions">


        <!-- SEARCH -->
        <a
          routerLink="/search"
          routerLinkActive="active"
          class="icon-button"
          aria-label="Search"
          title="Search"
        >
          <i class="bi bi-search"></i>
        </a>


        <!-- FAVORITES -->
        <a
          routerLink="/favorites"
          routerLinkActive="active"
          class="icon-button"
          aria-label="Favorites"
          title="Favorites"
        >
          <i class="bi bi-heart"></i>
        </a>


        <!-- LOGIN -->
        <a
          routerLink="/login"
          routerLinkActive="active"
          class="login-button"
        >
          <i class="bi bi-person"></i>
          <span>Login</span>
        </a>

      </div>

    </div>

  </div>

</nav>
